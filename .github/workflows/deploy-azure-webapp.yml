name: Deploy Azure Web App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Prepare deployment package
        run: |
          DEPLOY_DIR="$RUNNER_TEMP/crickethub-web-deploy"
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

          cp -R server "$DEPLOY_DIR/server"
          cp -R dist "$DEPLOY_DIR/dist"
          cp package.json "$DEPLOY_DIR/package.json"
          cp package-lock.json "$DEPLOY_DIR/package-lock.json"

          if [ -d "$DEPLOY_DIR/android-app" ]; then
            echo "android-app must not be part of web deploy package"
            exit 1
          fi

          cd "$DEPLOY_DIR"
          npm ci --omit=dev

      - name: Verify deployment payload
        run: |
          DEPLOY_DIR="$RUNNER_TEMP/crickethub-web-deploy"
          test -f "$DEPLOY_DIR/server/startup.js"
          test -f "$DEPLOY_DIR/server/server.js"
          test -f "$DEPLOY_DIR/dist/index.html"
          test -f "$DEPLOY_DIR/node_modules/express/package.json"
          if [ -d "$DEPLOY_DIR/android-app" ]; then
            echo "android-app unexpectedly found in deployment payload"
            exit 1
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/crickethub-web-deploy
